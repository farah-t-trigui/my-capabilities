apiVersion: v1
kind: ConfigMap
metadata:
  name: alpha4-step6-spec
  namespace: default
data:
  capability.yaml: |
    ikanos: "1.0.0-alpha4"
    binds:
    - namespace: "registry-env"
      description: "Maritime Registry API credentials and config."
      location: "file:///./shared/secrets.yaml"
      keys:
        REGISTRY_TOKEN: "registry-bearer-token"
        REGISTRY_VERSION: "registry-api-version"
        MCP_SERVER_TOKEN: "mcp-server-token"
    - namespace: "dockyard-env"
      description: "Legacy Dockyard API credentials."
      location: "file:///./shared/secrets.yaml"
      keys:
        DOCKYARD_API_KEY: "dockyard-api-key"
    capability:
      consumes:
        - import: registry
          from: ./shared/step6-registry-consumes.yaml
        - import: legacy
          from: ./shared/legacy-consumes.yaml
      exposes:
      - type: mcp
        address: "0.0.0.0"
        port: 3001
        namespace: shipyard-tools
        authentication:
          type: bearer
          token: "{{MCP_SERVER_TOKEN}}"
        description: "Shipyard MCP tools for fleet management"
        tools:
          list-ships:
            description: "List ships in the shipyard"
            inputParameters:
              status:
                type: string
                required: false
            call: registry.list-ships
            with:
              status: shipyard-tools.status
            outputParameters:
            - type: array
              mapping: "$."
              items:
                type: object
                properties:
                  imo:
                    type: string
                    mapping: "$.imo_number"
                  name:
                    type: string
                    mapping: "$.vessel_name"
          get-ship:
            description: "Retrieve a ship's details by IMO number"
            inputParameters:
              imo:
                type: string
                required: true
            call: registry.get-ship
            with:
              imo_number: shipyard-tools.imo
            outputParameters:
            - type: object
              properties:
                imo:
                  type: string
                  mapping: "$.imo_number"
                name:
                  type: string
                  mapping: "$.vessel_name"
          list-legacy-vessels:
            description: "List vessels from the legacy Dockyard"
            inputParameters:
              status:
                type: string
                required: false
            call: legacy.list-vessels
            with:
              status: shipyard-tools.status
            outputParameters:
            - type: array
              mapping: "$.vessel"
              items:
                type: object
                properties:
                  vesselCode:
                    type: string
                    mapping: "$.vesselCode"
                  name:
                    type: string
                    mapping: "$.vesselName"
      - type: control
        address: "0.0.0.0"
        port: 9090
        observability:
          enabled: true
          metrics:
            local:
              enabled: true
          traces:
            sampling: 1.0
            propagation: w3c
